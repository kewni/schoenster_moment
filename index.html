<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schönster Moment</title>
<style>
:root{--bg:#fbf7f1;--card:#fff;--ink:#2b2622;--mute:#8a8178;--acc:#e0803a;--line:#eadfd1;--acc-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292524;--ink:#f3ece4;--mute:#a39a90;--acc:#f0975a;--line:#3a3430;--acc-ink:#1c1917;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--ink:#f3ece4;--mute:#a39a90;--acc:#f0975a;--line:#3a3430;--acc-ink:#1c1917;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sub{color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.banner{background:var(--acc);color:var(--acc-ink);border-radius:16px;padding:14px 16px;margin-bottom:14px;font-weight:600}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--acc);color:var(--acc-ink);font-weight:600}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500}
button.link{background:none;color:var(--mute);padding:4px 8px;font-weight:500;font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.sp{flex:1}
img.pic{width:100%;max-height:300px;object-fit:cover;border-radius:12px;margin-top:10px;display:block}
.month{margin:22px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.entry{display:flex;gap:12px;cursor:pointer}
.entry .d{min-width:44px;text-align:center;color:var(--mute);font-size:.8rem;line-height:1.2}
.entry .d b{display:block;font-size:1.4rem;color:var(--acc)}
.entry .t{flex:1;white-space:pre-wrap;word-break:break-word}
.entry img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.rem{font-style:italic}
dialog,.set{display:none}
.set.on{display:block}
input[type=time]{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.empty{color:var(--mute);text-align:center;padding:30px 0}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>✨ Schönster Moment</h1><div class="sub" id="streak"></div></div>
    <button class="link" id="gear">Einstellungen</button>
  </div>

  <div class="card set" id="set">
    <div>Abendliche Erinnerung um <input type="time" id="rtime" value="20:00"></div>
    <div class="row"><button class="ghost" id="notif">Benachrichtigungen erlauben</button></div>
    <div class="row"><button class="ghost" id="exp">Backup exportieren</button><button class="ghost" id="imp">Backup importieren</button><input type="file" id="impf" accept=".json,application/json" hidden></div>
    <div class="sub" id="bmsg" style="margin-top:6px"></div>
    <div class="sub" style="margin-top:8px">Benachrichtigungen erscheinen, solange die App in einem Tab geöffnet ist. Beim Öffnen am Abend wirst du außerdem hier in der App erinnert.</div>
  </div>

  <div class="banner" id="banner" hidden>Es ist Abend – was war heute dein schönster Moment?</div>

  <div class="card" id="form">
    <div class="sub" id="fdate"></div>
    <textarea id="txt" placeholder="Was war heute dein schönster Moment?"></textarea>
    <img class="pic" id="prev" hidden alt="">
    <div class="row">
      <input type="file" id="file" accept="image/*" hidden>
      <button class="ghost" id="pick">📷 Bild</button>
      <button class="link" id="rmimg" hidden>Bild entfernen</button>
      <span class="sp"></span>
      <button class="link" id="del" hidden>Löschen</button>
      <button id="save">Speichern</button>
    </div>
  </div>

  <div class="card" id="remember" hidden>
    <div class="sub">Erinnerst du dich?</div>
    <div id="rbody"></div>
    <div class="row"><button class="ghost" id="again">Noch einer</button></div>
  </div>

  <div id="list"></div>
</main>

<script>
const $=s=>document.querySelector(s);
let db=null,mem={},items=[],cur=null,curImg=null;
const keyOf=d=>{const x=d||new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const fromKey=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lsGet=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

function openDB(){return new Promise((res,rej)=>{try{const r=indexedDB.open('moments',1);r.onupgradeneeded=()=>r.result.createObjectStore('m',{keyPath:'date'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
const store=m=>db.transaction('m',m).objectStore('m');
const dbAll=()=>db?new Promise(r=>{const q=store('readonly').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}):Promise.resolve(Object.values(mem));
const dbPut=o=>db?new Promise(r=>{const q=store('readwrite').put(o);q.onsuccess=q.onerror=()=>r()}):(mem[o.date]=o,Promise.resolve());
const dbDel=k=>db?new Promise(r=>{const q=store('readwrite').delete(k);q.onsuccess=q.onerror=()=>r()}):(delete mem[k],Promise.resolve());

function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
img.onload=()=>{const m=1000,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.75))};img.onerror=rej;img.src=u})}

const fmtLong=k=>fromKey(k).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function setForm(k){
  cur=k;const e=items.find(i=>i.date===k);
  $('#fdate').textContent=(k===keyOf()?'Heute · ':'')+fmtLong(k);
  $('#txt').value=e?e.text:'';curImg=e?e.img||null:null;
  showImg();$('#del').hidden=!e;$('#save').textContent=e?'Aktualisieren':'Speichern';
}
function showImg(){$('#prev').hidden=!curImg;$('#rmimg').hidden=!curImg;if(curImg)$('#prev').src=curImg}

function streak(){
  const have=new Set(items.map(i=>i.date));let n=0,d=new Date();
  if(!have.has(keyOf(d)))d.setDate(d.getDate()-1);
  while(have.has(keyOf(d))){n++;d.setDate(d.getDate()-1)}
  $('#streak').textContent=items.length?(n>1?n+' Tage in Folge · ':'')+items.length+(items.length===1?' Moment':' Momente'):'Dein erster Moment wartet';
}

function renderList(){
  const L=$('#list');
  if(!items.length){L.innerHTML='<div class="empty">Noch keine Momente – schreib den ersten oben auf.</div>';return}
  const sorted=[...items].sort((a,b)=>b.date.localeCompare(a.date));let html='',last='';
  for(const e of sorted){
    const d=fromKey(e.date),m=d.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
    if(m!==last){html+='<div class="month">'+m+'</div>';last=m}
    html+='<div class="card entry" data-k="'+e.date+'"><div class="d"><b>'+d.getDate()+'</b>'+d.toLocaleDateString('de-DE',{weekday:'short'})+'</div><div class="t">'+esc(e.text)+'</div>'+(e.img?'<img src="'+e.img+'" alt="">':'')+'</div>';
  }
  L.innerHTML=html;
  L.querySelectorAll('.entry').forEach(el=>el.onclick=()=>{setForm(el.dataset.k);scrollTo({top:0,behavior:'smooth'})});
}

function remember(){
  const old=items.filter(i=>i.date!==keyOf());
  $('#remember').hidden=!old.length;if(!old.length)return;
  const e=old[Math.floor(Math.random()*old.length)];
  $('#rbody').innerHTML='<div class="sub">'+fmtLong(e.date)+'</div><div class="rem">'+esc(e.text)+'</div>'+(e.img?'<img class="pic" src="'+e.img+'" alt="">':'');
}

function banner(){
  const [h,m]=lsGet('rtime','20:00').split(':').map(Number),n=new Date();
  const due=n.getHours()*60+n.getMinutes()>=h*60+m;
  $('#banner').hidden=!(due&&!items.some(i=>i.date===keyOf()));
}

function tick(){
  banner();
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(!$('#banner').hidden&&lsGet('notified','')!==keyOf()){
      lsSet('notified',keyOf());
      new Notification('Schönster Moment',{body:'Was war heute dein schönster Moment?'});
    }
  }catch(e){}
}

async function refresh(){items=await dbAll();streak();renderList();remember();banner()}

$('#pick').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{curImg=await compress(f);showImg()}catch(x){alert('Bild konnte nicht geladen werden.')}e.target.value=''};
$('#rmimg').onclick=()=>{curImg=null;showImg()};
$('#save').onclick=async()=>{
  const t=$('#txt').value.trim();if(!t&&!curImg){$('#txt').focus();return}
  await dbPut({date:cur,text:t,img:curImg,ts:Date.now()});
  await refresh();setForm(keyOf());
};
$('#del').onclick=async()=>{if(!confirm('Diesen Moment löschen?'))return;await dbDel(cur);await refresh();setForm(keyOf())};
$('#again').onclick=remember;

let dl=null;
(async()=>{try{dl=await window.claude.use('downloads')}catch(e){dl=null}})();
const bmsg=t=>{$('#bmsg').textContent=t};
$('#exp').onclick=async()=>{
  if(!items.length){bmsg('Noch nichts zu sichern.');return}
  const data=JSON.stringify({app:'schoenster-moment',version:1,exported:new Date().toISOString(),moments:items},null,1);
  const name='schoenster-momente-'+keyOf()+'.json';
  try{
    if(dl)await dl.save({filename:name,data});
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
    bmsg('Backup gespeichert ('+items.length+' Momente).')
  }
  catch(e){bmsg(e&&e.code==='declined'?'Abgebrochen.':'Export ist hier nicht möglich.')}
};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.moments;
    if(!Array.isArray(arr))throw 0;
    let n=0;
    for(const m of arr){
      if(!m||!/^\d{4}-\d{2}-\d{2}$/.test(m.date)||typeof m.text!=='string')continue;
      const have=items.find(i=>i.date===m.date);
      if(have&&(have.ts||0)>=(m.ts||0))continue;
      await dbPut({date:m.date,text:m.text,img:(typeof m.img==='string'&&m.img.startsWith('data:image/'))?m.img:null,ts:m.ts||Date.now()});n++;
    }
    await refresh();bmsg(n+' Momente importiert.');
  }catch(x){bmsg('Datei konnte nicht gelesen werden.')}
};
$('#gear').onclick=()=>$('#set').classList.toggle('on');
$('#rtime').value=lsGet('rtime','20:00');
$('#rtime').onchange=e=>{lsSet('rtime',e.target.value||'20:00');lsSet('notified','');tick()};
$('#notif').onclick=async()=>{
  try{const p=await Notification.requestPermission();$('#notif').textContent=p==='granted'?'Benachrichtigungen aktiv ✓':'Nicht erlaubt'}catch(e){$('#notif').textContent='Hier nicht verfügbar'}
};
try{if('Notification' in window&&Notification.permission==='granted')$('#notif').textContent='Benachrichtigungen aktiv ✓'}catch(e){}

(async()=>{try{db=await openDB()}catch(e){db=null}
  await refresh();setForm(keyOf());setInterval(tick,30000);tick();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
})();
</script>
</body>
</html>
